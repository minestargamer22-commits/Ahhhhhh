name: Build Mod

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o BloodySwordAnimations-clean.zip -d project

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: project
        run: gradle build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Bloody-Sword-Animations
          path: |
            project/build/libs/*.jar
            !project/build/libs/*-sources.jar
