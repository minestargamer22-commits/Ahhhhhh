name: Build Mod

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project
        run: |
          if [ -f build.gradle ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          else
            ZIP=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n 1)
            if [ -z "$ZIP" ]; then echo "ERROR: no zip found"; ls -la; exit 1; fi
            rm -rf project
            unzip -o "$ZIP" -d project
            BG=$(find project -name build.gradle | head -n 1)
            echo "PROJECT_DIR=$(dirname "$BG")" >> $GITHUB_ENV
          fi

      - name: Auto-fix old code for 1.21.11
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          MAIN=src/main/java/com/bloodystar/swordanim/BloodySwordAnimations.java
          MENU=src/main/java/com/bloodystar/swordanim/AnimationMenuScreen.java
          sed -i 's/import net.minecraft.item.SwordItem;/import net.minecraft.registry.tag.ItemTags;/' $MAIN
          sed -i 's/getMainHandStack().getItem() instanceof SwordItem/getMainHandStack().isIn(ItemTags.SWORDS)/g' $MAIN
          sed -i '/renderBackground(context, mouseX, mouseY, delta);/d' $MENU
          if grep -rn "SwordItem" src; then echo "ERROR: SwordItem still present"; exit 1; fi
          echo "Code fixed OK"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Bloody-Sword-Animations
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
          if-no-files-found: error
