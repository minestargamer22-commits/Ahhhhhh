name: Build Mod

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project
        run: |
          if [ -f build.gradle ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          else
            ZIP=$(find . -name "*.zip" -not -path "./.git/*" | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "No zip and no build.gradle found. Repo files:"
              ls -la
              exit 1
            fi
            echo "Using zip: $ZIP"
            unzip -o "$ZIP" -d project
            BG=$(find project -name build.gradle | head -n 1)
            echo "PROJECT_DIR=$(dirname "$BG")" >> $GITHUB_ENV
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Bloody-Sword-Animations
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
