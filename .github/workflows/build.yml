name: Build Mod

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project
        run: |
          echo "=== Repo files ==="
          ls -la
          if [ -f build.gradle ]; then
            echo "Using project from repo root"
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          else
            if [ -f BloodySwordAnimations-clean.zip ]; then
              ZIP=BloodySwordAnimations-clean.zip
            else
              ZIP=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n 1)
            fi
            if [ -z "$ZIP" ]; then
              echo "ERROR: no build.gradle and no zip found in repo"
              exit 1
            fi
            echo "Using zip: $ZIP"
            rm -rf project
            unzip -o "$ZIP" -d project
            BG=$(find project -name build.gradle | head -n 1)
            if [ -z "$BG" ]; then
              echo "ERROR: build.gradle not found inside the zip"
              exit 1
            fi
            echo "PROJECT_DIR=$(dirname "$BG")" >> $GITHUB_ENV
          fi

      - name: Check source version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if grep -rn "SwordItem" src; then
            echo "ERROR: old source code detected (SwordItem). Upload the newest zip."
            exit 1
          fi
          echo "Source looks up to date"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Bloody-Sword-Animations
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
          if-no-files-found: error
